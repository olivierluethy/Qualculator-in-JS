<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/favicon.ico">
    <title>Qualculator</title>

    <!-- Tailwind CSS via Play CDN: all styling is done with utility classes;
         no hand-written CSS files exist in this project. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Register a small utility (hide horizontal scrollbars) through Tailwind's
        // config so styling stays entirely inside Tailwind — no separate CSS file.
        tailwind.config = {
            plugins: [
                function ({ addUtilities }) {
                    addUtilities({
                        '.no-scrollbar::-webkit-scrollbar': { display: 'none' },
                        '.no-scrollbar': { '-ms-overflow-style': 'none', 'scrollbar-width': 'none' },
                    });
                },
            ],
        };
    </script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">

    <div class="mx-auto max-w-5xl px-4 py-6 sm:py-10">

        <!-- Header -->
        <header class="flex items-center justify-between mb-5">
            <h1 class="text-2xl font-bold tracking-tight">
                Qual<span class="text-indigo-400">culator</span>
            </h1>
            <button id="history-toggle" type="button"
                class="flex items-center gap-2 rounded-lg bg-slate-800 hover:bg-slate-700 px-3 py-2 text-sm text-slate-200 transition-colors">
                <span aria-hidden="true">🕘</span> History
            </button>
        </header>

        <!-- Calculator card -->
        <main class="rounded-2xl bg-slate-900 border border-slate-800 shadow-xl p-4 sm:p-5">

            <!-- Shared display: full expression + live preview -->
            <div id="display" class="rounded-xl bg-slate-800/40 border border-slate-800 p-4 mb-4 max-w-xl mx-auto w-full">
                <div class="flex justify-end mb-1">
                    <span id="angle"
                        class="text-[10px] font-semibold tracking-wider text-slate-400 bg-slate-800 rounded px-1.5 py-0.5">DEG</span>
                </div>
                <!-- expression line: always shows the full running expression, incl. pending operator -->
                <div id="expr"
                    class="text-right text-3xl font-mono whitespace-nowrap overflow-x-auto no-scrollbar leading-tight">
                    0</div>
                <!-- live preview result -->
                <div id="preview" class="text-right text-lg h-7 overflow-hidden text-slate-400"></div>
            </div>

            <!-- Mode tabs: even grid that never overlaps; wraps 2 -> 4 -> 7 across -->
            <div id="tabs" role="tablist"
                class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2 mb-5"></div>

            <!-- Mode panels (mounted by JS) -->
            <div id="panels"></div>
        </main>

        <p class="text-center text-xs text-slate-600 mt-4">
            Keyboard: digits, <span class="text-slate-500">+ − * / % ^ ( )</span>,
            Enter = <span class="text-slate-500">=</span>, Backspace, Esc = clear.
        </p>
    </div>

    <!-- History drawer (slide-over) -->
    <div id="history-overlay" class="hidden fixed inset-0 bg-black/50 z-40"></div>
    <aside id="history-drawer"
        class="fixed top-0 right-0 h-full w-80 max-w-[85vw] bg-slate-900 border-l border-slate-800 z-50 translate-x-full transition-transform duration-300 ease-out flex flex-col">
        <div class="flex items-center justify-between p-4 border-b border-slate-800">
            <h2 class="text-lg font-semibold">History</h2>
            <div class="flex items-center gap-2">
                <button id="history-clear" type="button"
                    class="text-xs rounded-lg bg-slate-800 hover:bg-rose-900/70 px-2.5 py-1.5 text-slate-300 transition-colors">Clear
                    all</button>
                <button id="history-close" type="button"
                    class="rounded-lg bg-slate-800 hover:bg-slate-700 w-8 h-8 text-slate-300 transition-colors"
                    aria-label="Close history">&times;</button>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-2">
            <p id="history-empty" class="text-sm text-slate-500 text-center mt-8">
                No calculations yet.<br>Results from every mode appear here.
            </p>
            <div id="history-list" class="space-y-2"></div>
        </div>
        <p class="text-[11px] text-slate-600 px-4 py-2 border-t border-slate-800">
            Tap a <span class="text-indigo-400">result</span> to insert it, or an
            <span class="text-slate-400">expression</span> to reload it.
        </p>
    </aside>

    <script type="module" src="js/main.js"></script>
</body>

</html>
